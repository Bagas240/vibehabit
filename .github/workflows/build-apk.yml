name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          SDK_MANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          if [ -n "$SDK_MANAGER" ]; then
            echo "Found sdkmanager at: $SDK_MANAGER"
            yes | "$SDK_MANAGER" --licenses || true
          else
            echo "sdkmanager not found in $ANDROID_HOME/cmdline-tools"
          fi

      - name: Prepare build environment & debug keystore
        run: |
          chmod +x gradlew

          # 1. Ensure a valid debug.keystore exists for :app:validateSigningDebug
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
            echo "Attempted decode from debug.keystore.base64"
          fi

          if [ ! -s "debug.keystore" ] || ! keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey > /dev/null 2>&1; then
            echo "debug.keystore missing or invalid. Generating fresh Android debug.keystore..."
            rm -f debug.keystore
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "debug.keystore generated successfully."
          fi

          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore 2>/dev/null || true

          echo "Validating keystore content:"
          keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey

          # 2. Ensure .env exists for Secrets Gradle Plugin
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
              echo "Created .env from .env.example"
            else
              touch .env
              echo "Created empty .env"
            fi
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VibeHabit-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
